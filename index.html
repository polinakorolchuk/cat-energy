<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Energy</title>
  <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
  <header class="header">
    <div class="header__container">
      <div class="header__logo">
        <img src="./assets/logo/logo-mobile.svg" alt="logo mobile" class="header__logo-image" loading="lazy">
      </div>
      <input type="checkbox" id="burger-checkbox" class="header__burger-checkbox">
      <label for="burger-checkbox" class="header__burger" aria-label="Меню">
        <span class="header__burger-line"></span>
        <span class="header__burger-line"></span>
        <span class="header__burger-line"></span>
      </label>
      <nav class="header__menu">
        <ul class="header__list">
          <li class="header__item"><a href="#" class="header__link">главная</a></li>
          <li class="header__item"><a href="#" class="header__link">каталог продукции</a></li>
          <li class="header__item"><a href="#" class="header__link">подбор программы</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <h1 class="hero__title">Функциональное питание для котов</h1>
      <p class="hero__subtitle">Занялся собой? Займись котом!</p>
      <img src="./assets/promo/promo.png" alt="cat energy image" class="hero__image">
      <a href="#" class="hero__button">подобрать программу</a>
    </section>
  </main>

<footer class="footer">
  <div class="footer__container">
    <div class="footer__logo">
      <img src="./assets/logo/logo.svg" alt="logo">
    </div>

    <div class="footer__social">
      <a href="#" class="footer__social-link" aria-label="vkontakte">
        <img src="./assets/images/logo/icon_vkontakte.svg" alt="vkontakte">
      </a>
      <a href="#" class="footer__social-link" aria-label="instagram">
        <img src="./assets/images/logo/icon_instagram.svg" alt="instagram">
      </a>
      <a href="#" class="footer__social-link" aria-label="facebook">
        <img src="./assets/images/logo/icon_facebook.svg" alt="facebook">
      </a>
    </div>

    <div class="footer__html">
      <span>HTML Academy</span>
      <a href="https://htmlacademy.ru" target="_blank" rel="noopener noreferrer">
        <img src="./assets/images/logo/htmlacademy.svg" alt="html academy logo">
      </a>
    </div>
  </div>
</footer>
  <script src="./script.js"></script>
</body>
</html>
