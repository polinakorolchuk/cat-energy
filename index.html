<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Energy</title>
  <link rel="stylesheet" href="./styles/style.css">
  <link href="https://fonts.googleapis.com/css?family=Oswald:regular,500" rel="stylesheet" />
  <link href="https://fonts.cdnfonts.com/css/arial" rel="stylesheet"> 
</head>
<body>

  <!-- ======= HEADER ======= -->
  <header class="header">
    <div class="header__container">
      <!-- ЛОГОТИП -->
      <div class="header__logo logo">
        <!-- Мобильная версия -->
        <div class="logo__mobile">
          <img src="./assets/logo/logo-mobile.svg" alt="Cat Energy mobile logo" loading="lazy">
          <img src="./assets/logo/logo 2.svg" alt="Cat Energy text logo" loading="lazy">
        </div>

        <!-- Планшетная версия -->
        <img class="logo__tablet" src="./assets/logo/logo-tablet.svg" alt="Cat Energy tablet logo" loading="lazy">

        <!-- Десктопная версия -->
        <img class="logo__desktop" src="./assets/logo/logo-desktop.svg" alt="Cat Energy desktop logo" loading="lazy">
      </div>

      <!-- БУРГЕР -->
      <input type="checkbox" id="burger-checkbox" class="burger-checkbox" aria-controls="header__menu">
      <label for="burger-checkbox" class="burger" aria-label="Меню">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <!-- МЕНЮ -->
      <nav class="header__menu" id="header__menu">
        <ul class="header__list">
          <li><a href="#" class="header__link">главная</a></li>
          <li><a href="#catalog" class="header__link">каталог продукции</a></li>
          <li><a href="#form" class="header__link">подбор программы</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ======= MAIN ======= -->
  <main class="page">
    <section class="hero">
      <h1 class="hero__title">Функциональное питание для котов</h1>
      <p class="hero__subtitle">Занялся собой? Займись котом!</p>
      <img src="./assets/promo/promo.png" alt="cat energy image" class="hero__image">
      <a href="#" class="hero__button">подобрать программу</a>
    </section>
  </main>

  <!-- ======= FOOTER ======= -->
  <footer class="footer">
    <div class="footer__container">
      <div class="footer__logo">
        <img src="./assets/logo/logo.svg" alt="logo">
      </div>

      <div class="footer__social">
        <a href="#" class="footer__social-link" aria-label="vkontakte">
          <img src="./assets/images/logo/icon_vkontakte.svg" alt="vkontakte">
        </a>
        <a href="#" class="footer__social-link" aria-label="instagram">
          <img src="./assets/images/logo/icon_instagram.svg" alt="instagram">
        </a>
        <a href="#" class="footer__social-link" aria-label="facebook">
          <img src="./assets/images/logo/icon_facebook.svg" alt="facebook">
        </a>
      </div>

      <div class="footer__html">
        <span>HTML Academy</span>
        <a href="https://htmlacademy.ru" target="_blank" rel="noopener noreferrer">
          <img src="./assets/images/logo/htmlacademy.svg" alt="html academy logo">
        </a>
      </div>
    </div>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
